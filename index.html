<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="0; url=https://appennaer.no/personvern/">
<link rel="canonical" href="https://appennaer.no/personvern/">
<title>Vilkår og personvern i Nær</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
--paper: #FFF7F0;
--plum: #2A1F2E;
--plum-soft: rgba(42, 31, 46, 0.78);
--honey: #E89B3C;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
margin: 0;
background: var(--paper);
color: var(--plum);
font-family: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
font-size: 18px;
line-height: 1.72;
-webkit-font-smoothing: antialiased;
text-rendering: optimizeLegibility;
}

.wrap {
max-width: 480px;
margin: 0 auto;
padding: 96px 24px;
text-align: center;
}

.orb {
width: 96px;
height: 96px;
display: block;
margin: 0 auto 28px;
}

h1 {
font-family: "Fraunces", Georgia, serif;
font-optical-sizing: auto;
font-weight: 600;
font-size: 2rem;
line-height: 1.15;
letter-spacing: -0.01em;
margin: 0 0 14px;
}

p {
color: var(--plum-soft);
margin: 0 0 24px;
}

a {
color: var(--plum);
font-weight: 600;
text-decoration: none;
border-bottom: 2px solid var(--honey);
padding-bottom: 1px;
}

@media (max-width: 480px) {
body { font-size: 17px; }
.wrap { padding: 72px 20px; }
h1 { font-size: 1.75rem; }
}
</style>
</head>
<body>
<main class="wrap">

<svg class="orb" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<circle cx="48" cy="48" r="46" stroke="#E89B3C" stroke-opacity="0.20" stroke-width="1.5"/>
<circle cx="48" cy="48" r="38" stroke="#E89B3C" stroke-opacity="0.30" stroke-width="1.5"/>
<circle cx="48" cy="48" r="30" stroke="#E89B3C" stroke-opacity="0.45" stroke-width="1.5"/>
<circle cx="48" cy="48" r="22" fill="#2A1F2E"/>
<circle cx="48" cy="46" r="7" fill="#E89B3C" fill-opacity="0.9"/>
<circle cx="48" cy="46" r="13" fill="#E89B3C" fill-opacity="0.18"/>
</svg>

<h1>Vilkår og personvern i Nær</h1>
<p>Denne siden har flyttet til Nærs egen nettside. Du sendes videre nå.</p>
<p>Skjer det ikke av seg selv:<br>
<a href="https://appennaer.no/personvern/">Les vilkår og personvern</a></p>

</main>
</body>
</html>
